<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oportunidades Marketplace</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1c1e21;--mut:#65676b;--bd:#dadde1;--ac:#1877f2;--ok:#1a7f37;--bad:#c62828;--warn:#b26a00;--hi:#fff7e0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#18191a;--card:#242526;--tx:#e4e6eb;--mut:#b0b3b8;--bd:#3a3b3c;--ac:#4599ff;--ok:#4cc26a;--bad:#ff6b6b;--warn:#ffb74d;--hi:#3a3020}}
:root[data-theme="dark"]{--bg:#18191a;--card:#242526;--tx:#e4e6eb;--mut:#b0b3b8;--bd:#3a3b3c;--ac:#4599ff;--ok:#4cc26a;--bad:#ff6b6b;--warn:#ffb74d;--hi:#3a3020}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bd);padding:12px 16px}
h1{margin:0 0 4px;font-size:20px}.sub{color:var(--mut);font-size:13px;margin-bottom:10px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar button,.bar select,.bar input{font:inherit;padding:6px 12px;border-radius:18px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);cursor:pointer;max-width:100%}
.bar button.on{background:var(--ac);border-color:var(--ac);color:#fff}.bar input{cursor:text;min-width:160px;flex:1}
.aviso{max-width:1400px;margin:12px auto 0;padding:10px 14px;border:1px solid var(--warn);color:var(--warn);border-radius:10px;font-size:14px}
.wrap{padding:0 16px}
h3{max-width:1400px;margin:18px auto 0;font-size:16px}
main,#top{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;padding:12px 0;max-width:1400px;margin:0 auto}
.c{background:var(--card);border:1px solid var(--bd);border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .1s}
.c.hi{background:var(--hi);border-color:var(--warn)}
.c:hover{transform:translateY(-2px)}.ph{width:100%;aspect-ratio:1;background-color:#000;background-repeat:no-repeat;display:block}
.c .b{padding:10px}.p{font-weight:700;font-size:18px}.t{margin:2px 0 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.m{color:var(--mut);font-size:13px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.why{font-size:13px;margin-top:6px}
.tag{font-size:12px;padding:2px 8px;border-radius:10px;border:1px solid var(--bd)}.low{color:var(--ok);border-color:var(--ok)}.high{color:var(--bad);border-color:var(--bad)}.warn{color:var(--warn);border-color:var(--warn)}
.n{position:relative}.n span{position:absolute;right:8px;bottom:8px;background:#000a;color:#fff;font-size:12px;padding:2px 7px;border-radius:10px}
#mod{position:fixed;inset:0;background:#000c;display:none;z-index:10;padding:16px;overflow:auto}
#mod .box{background:var(--card);max-width:1000px;margin:0 auto;border-radius:12px;display:grid;grid-template-columns:1.2fr 1fr;overflow:hidden}
@media (max-width:760px){#mod .box{grid-template-columns:1fr}#mod{padding:8px}}
.gal{background:#000;position:relative;display:flex;flex-direction:column}.gal .big{width:100%;aspect-ratio:1;max-height:70vh;margin:0 auto}
.gal .nav{position:absolute;top:40%;background:#0008;color:#fff;border:0;font-size:28px;width:44px;height:44px;border-radius:50%;cursor:pointer}
.prev{left:8px}.next{right:8px}.th{display:flex;gap:4px;overflow-x:auto;padding:6px;background:#111}
.th .ph{width:58px;height:58px;flex:none;opacity:.55;cursor:pointer;border-radius:4px}.th .ph.on{opacity:1;outline:2px solid var(--ac)}
.det{padding:18px;overflow:auto;max-height:85vh}.det h2{margin:0 0 6px;font-size:19px}.desc{white-space:pre-wrap;margin-top:12px;border-top:1px solid var(--bd);padding-top:12px;overflow-wrap:anywhere}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.acts a{background:var(--ac);color:#fff;text-decoration:none;padding:8px 14px;border-radius:8px;font-weight:600}
.x{float:right;background:none;border:0;font-size:26px;color:var(--mut);cursor:pointer;line-height:1}
table.md{border-collapse:collapse;font-size:14px;margin:8px 0}table.md td,table.md th{border:1px solid var(--bd);padding:4px 10px;text-align:right}table.md td:first-child,table.md th:first-child{text-align:left}
details{max-width:1400px;margin:12px auto 0}summary{cursor:pointer;font-weight:600}
.vazio{grid-column:1/-1;text-align:center;color:var(--mut);padding:40px}
</style></head><body>
<header><h1>Oportunidades no Marketplace — Palmas/TO</h1>
<div class="sub" id="sub"></div>
<div class="bar" id="cats"></div>
<div class="bar" style="margin-top:8px"><select id="mods"></select>
<select id="ord"><option value="p">Menor preço</option><option value="P">Maior preço</option><option value="v">Mais abaixo da média</option></select>
<input id="q" placeholder="Buscar no título ou descrição…"></div></header>
<div class="wrap">
<div class="aviso" id="aviso"></div>
<details><summary>Preço médio por modelo nesta coleta</summary><div id="medias"></div></details>
<details><summary>📈 O que mais vende (histórico)</summary><div id="vendas"></div></details>
<h3>⭐ Melhores oportunidades</h3><div id="top"></div>
<h3>Todos os anúncios</h3><main id="g"></main>
</div>
<div id="mod"><div class="box"><div class="gal"><div class="big ph" id="big"></div><button class="nav prev" id="pv">‹</button><button class="nav next" id="nx">›</button><div class="th" id="th"></div></div>
<div class="det" id="det"></div></div></div>
<script>
const D=__DADOS__;
const R=__RESUMO__;
const bg=(d,i)=>`background-image:url(${d.tira});background-size:${d.nf*100}% 100%;background-position:${d.nf>1?i/(d.nf-1)*100:0}% 0`;
const fmt=v=>'R$ '+v.toLocaleString('pt-BR');
let cat='Todos',cur=null,idx=0;
const cats=['Todos',...new Set(D.map(d=>d.cat))];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function tags(d){let t='';if(d.vs_media!=null)t+=`<span class="tag ${d.vs_media<0?'low':'high'}">${d.vs_media>0?'+':''}${d.vs_media}% vs média</span>`;
 if(d.alerta)t+='<span class="tag warn">⚠ cita defeito</span>';return t}
const card=d=>`<div class="c${d.destaque?' hi':''}" data-id="${d.id}"><div class="n"><div class="ph" style="${bg(d,0)}"></div><span>📷 ${d.nf}</span></div>
 <div class="b"><div class="p">${fmt(d.preco)}</div><div class="t">${esc(d.titulo)}</div><div class="m">${esc(d.mod)} · ${esc(d.local)}</div><div class="tags">${tags(d)}</div>${d.destaque?`<div class="why">⭐ ${esc(d.destaque)}</div>`:''}</div></div>`;
function barra(){document.getElementById('cats').innerHTML=cats.map(c=>`<button class="${c===cat?'on':''}" data-c="${esc(c)}">${esc(c)} (${c==='Todos'?D.length:D.filter(d=>d.cat===c).length})</button>`).join('');
 const ms=[...new Set(D.filter(d=>cat==='Todos'||d.cat===cat).map(d=>d.mod))];
 document.getElementById('mods').innerHTML='<option value="">Todos os modelos</option>'+ms.map(m=>`<option>${esc(m)}</option>`).join('')}
function lista(){const mod=document.getElementById('mods').value,q=document.getElementById('q').value.toLowerCase(),o=document.getElementById('ord').value;
 let L=D.filter(d=>(cat==='Todos'||d.cat===cat)&&(!mod||d.mod===mod)&&(!q||(d.titulo+' '+d.descricao).toLowerCase().includes(q)));
 L.sort(o==='p'?(a,b)=>a.preco-b.preco:o==='P'?(a,b)=>b.preco-a.preco:(a,b)=>(a.vs_media??99)-(b.vs_media??99));
 document.getElementById('g').innerHTML=L.length?L.map(card).join(''):'<div class="vazio">Nada encontrado.</div>'}
function abrir(id){cur=D.find(d=>d.id===id);idx=0;
 document.getElementById('det').innerHTML=`<button class="x" id="fx">×</button><h2>${esc(cur.titulo)}</h2><div class="p">${fmt(cur.preco)}</div>
 <div class="m">${esc(cur.mod)} · ${esc(cur.local)}${cur.condicao?' · '+esc(cur.condicao):''}</div><div class="tags">${tags(cur)}</div>
 ${cur.destaque?`<div class="why">⭐ ${esc(cur.destaque)}</div>`:''}
 <div class="acts"><a href="${cur.link}" target="_blank" rel="noopener">Abrir no Facebook</a></div>
 <div class="desc">${esc(cur.descricao||'(sem descrição)')}</div>`;
 document.getElementById('fx').onclick=fechar;
 document.getElementById('th').innerHTML=Array.from({length:cur.nf},(_,i)=>`<div class="ph" data-i="${i}" style="${bg(cur,i)}"></div>`).join('');
 foto(0);document.getElementById('mod').style.display='block';document.body.style.overflow='hidden'}
function foto(i){idx=(i+cur.nf)%cur.nf;document.getElementById('big').style.cssText=bg(cur,idx);
 document.querySelectorAll('#th .ph').forEach((e,k)=>e.classList.toggle('on',k===idx));
 const multi=cur.nf>1;pv.style.display=nx.style.display=multi?'':'none'}
function fechar(){document.getElementById('mod').style.display='none';document.body.style.overflow='';cur=null}
document.getElementById('top').innerHTML=D.filter(d=>d.destaque).map(card).join('');
document.getElementById('cats').onclick=e=>{const c=e.target.dataset.c;if(c){cat=c;barra();lista()}};
['mods','ord'].forEach(i=>document.getElementById(i).onchange=lista);document.getElementById('q').oninput=lista;
['g','top'].forEach(i=>document.getElementById(i).onclick=e=>{const c=e.target.closest('.c');if(c)abrir(c.dataset.id)});
document.getElementById('th').onclick=e=>{if(e.target.dataset.i)foto(+e.target.dataset.i)};
pv.onclick=()=>foto(idx-1);nx.onclick=()=>foto(idx+1);
document.getElementById('mod').onclick=e=>{if(e.target.id==='mod')fechar()};
document.onkeydown=e=>{if(!cur)return;if(e.key==='Escape')fechar();if(e.key==='ArrowLeft')foto(idx-1);if(e.key==='ArrowRight')foto(idx+1)};
document.getElementById('sub').textContent=`Coleta de ${R.data} · ${D.length} anúncios da região de Palmas · cada anúncio comparado com a média do mesmo modelo`;
document.getElementById('aviso').textContent=`Preços de ${R.data}. Confira no Facebook se o anúncio ainda está ativo antes de chamar o vendedor; preço muito abaixo do normal pode ser golpe.`;
{const M=Object.entries(R.medias).sort((a,b)=>a[1][2].localeCompare(b[1][2])||a[0].localeCompare(b[0],'pt',{numeric:true}));
 document.getElementById('medias').innerHTML='<table class="md"><tr><th>Modelo</th><th>Categoria</th><th>Média</th><th>Anúncios</th></tr>'+M.map(([k,[v,q,c]])=>`<tr><td>${esc(k)}</td><td>${esc(c)}</td><td>${fmt(v)}</td><td>${q}${q<5?' ⚠':''}</td></tr>`).join('')+'</table><div class="m">Sem anúncios que citam defeito e sem preços fora de 40%–250% da mediana (peça, caixa, jogo avulso). ⚠ menos de 5 anúncios: média pouco confiável.</div>'}
{const V=R.vendas||{linhas:[]},L=V.linhas.filter(l=>l.vendidos+l.apagados>0),br=d=>d?d.split('-').reverse().join('/'):'';
 const f=v=>v==null?'–':fmt(v);
 document.getElementById('vendas').innerHTML=!L.length?`<div class="m">Histórico começou em ${br(V.inicio)}. O ranking aparece depois da próxima coleta, quando os anúncios que saíram do ar forem conferidos.</div>`:
 '<table class="md"><tr><th>Modelo</th><th>Vendidos</th><th>Apagados</th><th>Ainda ativos</th><th>Giro</th><th>Dias até sair</th><th>Preço de quem saiu</th><th>Preço dos ativos</th></tr>'+
 L.map(l=>`<tr><td>${esc(l.mod)}</td><td>${l.vendidos}</td><td>${l.apagados}</td><td>${l.ativos}</td><td>${l.giro}%</td><td>${l.dias??'–'}</td><td>${f(l.preco_saiu)}</td><td>${f(l.preco_ativo)}</td></tr>`).join('')+
 `</table><div class="m">Desde ${br(V.inicio)}. <b>Vendido</b> = marcado como vendido no Facebook (certeza). <b>Apagado</b> = anúncio removido (pode ter vendido por fora ou desistido). Giro = (vendidos + apagados) ÷ anúncios vistos.</div>`}
barra();lista();
</script></body></html>
